[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisapi"
dynamic = ["version"]
description = "CLI-first API security assessment platform for bug bounty hunters and penetration testers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vibusha Satheeshkumar" }]
keywords = ["api", "security", "assessment", "openapi", "pentest", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7",
    "pydantic>=2.6,<3.0",
    # Specification parsing. Only yaml.safe_load is ever used, so a
    # specification file cannot construct arbitrary Python objects.
    "pyyaml>=6.0,<7.0",
    # HTTP transport. Chosen for explicit connect/read timeouts, streaming
    # response bodies (so a size cap applies while receiving), and a mock
    # transport that makes the request path testable without a network.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
aegisapi = "aegisapi.main:main"

[project.urls]
Documentation = "https://github.com/vibusha/aegisapi/blob/main/README.md"
Source = "https://github.com/vibusha/aegisapi"

[tool.setuptools.dynamic]
version = { attr = "aegisapi.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "ARG", # unused arguments
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

# Pydantic "before" validators and TOML payloads genuinely receive arbitrary
# input, so a dynamically typed parameter is the honest annotation there.
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["aegisapi"]

[tool.ruff.lint.per-file-ignores]
# Fixtures such as workspace_root are requested for their side effects, which
# ruff cannot distinguish from a genuinely unused argument.
"tests/*" = ["ANN", "ARG"]
# BaseHTTPRequestHandler dispatches on method names it defines, so do_GET and
# friends cannot be renamed to satisfy the naming rules.
"tests/httpstub.py" = ["ANN", "ARG", "N802", "N815"]
